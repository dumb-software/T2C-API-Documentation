name: 'Weekly Lockfile Update'

on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Clear Lockfile
        run: rm -rf node_modules package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Create Pull Request
        id: createpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ci): update package-lock.json'
          title: 'Weekly package-lock.json update'
          branch: 'chore/update-lockfile'
          delete-branch: true
          body: >
            This PR is auto-generated by a GitHub action.
            It should automatically be merged if tests pass.

      - name: Mark Pull Request for Auto-Merge
        if: steps.createpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.createpr.outputs.pull-request-number }}
          merge-method: squash